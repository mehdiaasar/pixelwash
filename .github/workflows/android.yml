name: Android app
# Manual: needs the signing secrets PW_KEYSTORE_B64, PW_KEYSTORE_PASSWORD, PW_KEY_ALIAS, PW_KEY_PASSWORD.
# (v1.0.0 was built and signed locally, so the key never had to leave the Mac.)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.PW_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"; echo "PW_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"; fi
      - name: Build APK + AAB
        working-directory: android
        env:
          PW_KEYSTORE_PASSWORD: ${{ secrets.PW_KEYSTORE_PASSWORD }}
          PW_KEY_ALIAS: ${{ secrets.PW_KEY_ALIAS }}
          PW_KEY_PASSWORD: ${{ secrets.PW_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Collect files
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/*.apk out/Pixelwash-${GITHUB_REF_NAME}.apk
          cp android/app/build/outputs/bundle/release/*.aab out/Pixelwash-${GITHUB_REF_NAME}.aab
      - uses: actions/upload-artifact@v4
        with:
          name: pixelwash-android
          path: out/*
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber
